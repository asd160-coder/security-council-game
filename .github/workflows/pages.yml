# Builds on every push to main, so the build is proven in CI on a clean machine —
# not only on the laptop it was written on.
#
# Deploys ONLY when triggered by hand. Pages is deliberately not wired to fire
# on push: the repo is private and the game has not been reviewed live, so
# putting it on a public URL is a decision, not a side effect of a commit.
#
# To publish, once the repo is public:
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Actions → "Build and deploy" → Run workflow
# The site will appear at https://asd160-coder.github.io/security-council-game/
#
# vite.config.js already sets `base: './'`, so the build works from that
# subdirectory without any change.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Manual trigger only — see the note at the top of this file.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
